# This is the continuous integration job for `tower-gcra`.

# It runs on Ubuntu, using three versions of Rust: a "pined" least
# supported version, the current stable version and the current
# nightly version. After building, it will run the unit test suite.

name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '6 01 * * *'

jobs:
  build:
    name: build
    strategy:
      matrix:
        rust-build:
          - pinned
          - stable
          - nightly
        os: [ubuntu-26.04]
        include:
        - rust-build: pinned
          # 2026-11-27: cargo adit, currently at 0.23.0, requires rust 1.88
          rust: 1.88
        - rust-build: stable
          rust: 1.100.0
        - rust-build: nightly
          rust: nightly-2026-11-09
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    steps:

    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: "clippy, rustfmt"

    - name: Install tools
      shell: bash
      run: |
        cargo install --force --locked cargo-audit

    - name: Lint
      shell: bash
      run: 'admin/run-linters'

    - name: Build tower-gcra & run unit tests
      shell: bash
      run: 'admin/build-and-test'
